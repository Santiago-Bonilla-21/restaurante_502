<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Pasta La Vista</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* HEADER */
        header {
            background-color: #1f2937;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        /* CONTENEDOR PRINCIPAL */
        .main {
            display: flex;
        }

        /* SIDEBAR */
        .sidebar {
            width: 220px;
            background-color: #111827;
            min-height: 100vh;
            padding-top: 20px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            padding: 12px 20px;
            text-decoration: none;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #374151;
            color: white;
        }

        /* CONTENIDO */
        .contenido {
            flex: 1;
            padding: 20px;
        }

        .contenedor {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }

        /* TABLAS */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        table, th, td {
            border: none;
        }

        th {
            background-color: #e5e7eb;
            padding: 12px;
        }

        td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
        }

        /* CARDS */
        .card {
            display: inline-block;
            width: 200px;
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

    </style>
</head>

<body>

<header>
    Gestión restaurante 
</header>

<div class="main">

    <!-- MENÚ LATERAL -->
    <div class="sidebar">
        <a href="/">Inicio</a>
        <a href="/clientes/">Clientes</a>
        <a href="/empleados/">Empleados</a>
        <a href="/mesas/">Mesas</a>
        <a href="/platos/">Platos</a>
        <a href="/ordenes/">Órdenes</a>
        <a href="/facturas/">Facturas</a>
        <a href="/admin/">Admin</a>
    </div>

    <!-- CONTENIDO -->
    <div class="contenido">
        <div class="contenedor">
            {% block content %}
            {% endblock %}
        </div>
    </div>

</div>

</body>
</html>
