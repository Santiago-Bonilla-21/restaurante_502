{% load static %}

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Login | Gestión de restaurante </title>

    <link rel="stylesheet" href="{% static 'gestion/login.css' %}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>Gestión de restaurante</h1>

        <p class="subtitulo">
            Por favor inicie sesion para continuar
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Usuario</label>
                {{ form.username }}
            </div>

            <div class="input-group">
                <label>Contraseña</label>
                {{ form.password }}
            </div>

            <button type="submit">
                Ingresar
            </button>

        </form>

        <p class="registro-link">
            ¿No tienes cuenta?
            <a href="{% url 'registro' %}">
                Registrarse
            </a>
        </p>

    </div>

</div>

{% if messages %}

    {% for message in messages %}

        <div class="mensaje {{ message.tags }}">
            {{ message }}
        </div>

    {% endfor %}

{% endif %}
</body>
</html>
